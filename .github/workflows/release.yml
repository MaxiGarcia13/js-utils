name: Bump version on main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  lint-and-test:
    uses: ./.github/workflows/lint-and-test.yml

  bump:
    needs: lint-and-test
    uses: MaxiGarcia13/gh-actions/.github/workflows/bump-version.yml@main

  publish:
    name: Publish to npm
    if: ${{ needs.bump.outputs.tag != '' }}
    needs: bump
    uses: MaxiGarcia13/gh-actions/.github/workflows/npm-publish.yml@main
    secrets: inherit
    with:
      command: publish:npm

  release-notes:
    name: Create Release Notes
    if: ${{ needs.bump.outputs.tag != '' }}
    needs: bump
    uses: MaxiGarcia13/gh-actions/.github/workflows/create-release-notes.yml@main
    with:
      tag: ${{ needs.bump.outputs.tag }}
      default_branch: main
